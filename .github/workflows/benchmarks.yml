name: Benchmarks

# Runs only when started by hand from the Actions tab: shared runners are too noisy
# for timing every commit, and the results are for reading, not for passing or failing.
on:
  workflow_dispatch:
    inputs:
      swift:
        description: Swift toolchain
        type: choice
        options: ["6.4", "6.2"]
        default: "6.4"

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (Swift ${{ inputs.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ inputs.swift }}-noble
    defaults:
      run:
        working-directory: Benchmarks
        # bash runs with -o pipefail, so a failing report is not hidden by `tee`.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Swift 6.3 and later count allocations without jemalloc; 6.2 and earlier need it.
      - name: Install jemalloc
        if: inputs.swift == '6.2'
        run: apt-get update && apt-get install -y libjemalloc-dev
      # The TSPLIB server is sometimes unreachable, so the files are cached after the first
      # successful download. The key changes only when the checksums do, and the script
      # verifies restored files anyway.
      - name: Restore TSPLIB instances
        id: tsplib-cache
        uses: actions/cache/restore@v6
        with:
          path: Benchmarks/Data/*.atsp
          key: tsplib-${{ hashFiles('Benchmarks/Data/checksums.sha256') }}
      - name: Install curl
        if: steps.tsplib-cache.outputs.cache-hit != 'true'
        run: command -v curl >/dev/null || (apt-get update && apt-get install -y curl)
      # Always runs: on a cache hit it only checks the restored files and makes no request.
      - name: Download TSPLIB instances
        run: Scripts/download-tsplib.sh
      # Saved right away, so a later failing step does not lose the download.
      - name: Save TSPLIB instances
        if: steps.tsplib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Benchmarks/Data/*.atsp
          key: ${{ steps.tsplib-cache.outputs.cache-primary-key }}
      - name: Test the TSPLIB parser
        run: swift test
      - name: TSPLIB quality report
        run: swift run -c release TSPLIBReport | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Performance benchmarks
        run: swift package benchmark --no-progress
